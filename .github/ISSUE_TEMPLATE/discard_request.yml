name: Unwanted Result
description: Report a result that should not appear when the Goggle is applied.
title: "[Discard]: "
labels: ["discard"]
body:
  - type: markdown
    attributes:
      value: >
        Thank you for reporting this. Please include the search query, since a
        Goggle only re-ranks the candidates Brave Search already found for it.
  - type: input
    id: query
    attributes:
      label: Search Query
      description: The query you used.
      placeholder: swift concurrency
    validations:
      required: true
  - type: textarea
    id: urls
    attributes:
      label: Unwanted URLs
      description: The results that should not have appeared.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why it does not belong
      description: Explain why these results are unrelated to Swift.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots or anything else that helps.
